# 设置 Gradle 命令使用的默认 JVM 内存参数，可由用户配置或命令行属性覆盖。
# Minecraft 反编译过程需要足够的内存，因此应保留适当的内存上限。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## 环境属性

# Minecraft 版本必须与 Forge 版本匹配，才能获取有效的依赖构件。
minecraft_version=1.20.1
# Minecraft 版本范围可以使用任意正式发行版作为边界。
# 快照版、预发布版和候选发布版不保证能正确参与版本排序，
# 因为这些版本不遵循标准的版本命名约定。
minecraft_version_range=[1.20.1,1.21)
# Forge 版本必须与 Minecraft 版本匹配，才能获取有效的依赖构件。
forge_version=47.4.10
# Forge 版本范围可以使用任意 Forge 版本作为边界，也可以与加载器版本范围一致。
forge_version_range=[47,)
# 加载器版本范围只能使用 Forge / FML 的主版本号作为边界。
loader_version_range=[47,)
# 指定开发环境使用的映射渠道。
# 默认支持的映射渠道为 official、snapshot、snapshot_nodoc、stable 和 stable_nodoc。
# Gradle 插件可通过 channelProviders 扩展注册额外的映射渠道。
#
# | 渠道      | 版本格式             | 说明                                                                           |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | Mojang 官方映射文件中的字段名和方法名                                           |
# | parchment | YYYY.MM.DD-MCVersion  | 在官方映射基础上补充社区维护的参数名和 Javadoc 文档                              |
#
# 使用 official 或 parchment 映射时，必须了解并遵守 Mojang 的许可条款。
# 详细说明：https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
#
# Parchment 是由 ParchmentMC 维护的非官方项目，独立于 Minecraft Forge。
# 使用其映射需要额外配置，参见：https://parchmentmc.org/docs/getting-started
mapping_channel=official
# 指定所选映射渠道的映射版本。
# 版本格式必须符合该映射渠道的要求。
mapping_version=1.20.1


## Mod 属性

# Mod 的唯一标识符，英文字母必须小写，并符合正则表达式 [a-z][a-z0-9_]{1,63}。
# 必须与带有 @Mod 注解的入口类中定义的字符串常量一致。
mod_id=examplemod
# Mod 的显示名称，供玩家阅读。
mod_name=pengyoudejiu
# Mod 的许可证，默认保留所有权利；可在 https://choosealicense.com/ 了解其他许可证。
mod_license=All Rights Reserved
# Mod 的版本号；语义化版本规范参见：https://semver.org/
mod_version=1.0.0
# Mod 的组 ID，主要用于向 Maven 仓库发布构件。
# 应与 Mod 源码使用的基础包名一致。
# 命名规范：https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.example.examplemod
# Mod 作者信息，以普通文本形式显示在 Mod 列表中。
mod_authors=xc
# Mod 的描述，显示在 Mod 列表中；可使用 \n 表示换行。
mod_description=Example mod description.\nNewline characters can be used and will be replaced properly.